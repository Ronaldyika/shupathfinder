{% extends "finder/base.html" %}

{% block title %}Delete hall{% endblock %}

{% block content %}
<div class="container-xl py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="glass-card p-4 p-md-5">
                <h1 class="h4 panel-title mb-3">Delete hall?</h1>
                <p class="mb-1">You are about to remove <strong>{{ hall.name }}</strong> from the database.</p>
                <p class="text-muted small mb-4">This cannot be undone. Images stored for this hall will be removed from the file system.</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a class="btn btn-outline-secondary ms-2" href="{% url 'hall_manage_list' %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
